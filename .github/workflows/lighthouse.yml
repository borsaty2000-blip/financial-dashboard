name: lighthouse

on:
  workflow_dispatch:
    inputs:
      url:
        description: Public URL to audit
        required: true
        default: https://borsatyai.com

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ inputs.url }}
          uploadArtifacts: true
          temporaryPublicStorage: true
